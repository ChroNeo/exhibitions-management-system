services:
  db:
    container_name: ems-mysql
    image: mysql:8.4.0
    restart: unless-stopped
    expose:
      - 3306
    environment:
      TZ: Asia/Bangkok
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend-net

  backend:
    container_name: ems-backend
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3001}
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - uploads-data:/app/apps/backend/uploads
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)throw r;process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - frontend-net
      - backend-net

  frontend:
    container_name: ems-frontend
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_BASE: ${VITE_BASE}
        VITE_LIFF_REGISTRATION: ${VITE_LIFF_REGISTRATION}
        VITE_LIFF_TICKET: ${VITE_LIFF_TICKET}
        VITE_LIFF_SURVEY: ${VITE_LIFF_SURVEY}
        VITE_LIFF_CERTIFICATE: ${VITE_LIFF_CERTIFICATE}
        VITE_LIFF_EXHIBITION: ${VITE_LIFF_EXHIBITION}
        VITE_LIFF_NEWS: ${VITE_LIFF_NEWS}
        VITE_LIFF_MOCK: "false"
    depends_on: [backend]
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - frontend-net
  nginx:
    container_name: ems-nginx
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports: ["${APP_PORT:-80}:80"]
    volumes:
      - ./nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - frontend-net
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  
volumes:
  db-data:
  uploads-data: